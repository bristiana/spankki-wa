<!doctype html>
<html lang="{% block lang %}en{% endblock %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#00663d">
<link rel="icon" href="/static/oiva/oiva.png" type="image/png">
<title>{% block title %}S-Pankki{% endblock %}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#e2e8e5;--brand:#00663d;--brand-ink:#fff;--soft:#e7f3ec;--warn:#8a5a00;--warn-bg:#fff6e0;--err:#b3261e;--neg:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#18201d;--ink:#e8efeb;--muted:#9aa8a1;--line:#2a3430;--brand:#2fae6f;--brand-ink:#06140d;--soft:#1d2b24;--warn:#f3c66b;--warn-bg:#2b2416;--err:#ff8a80;--neg:#ff8a80}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
  a{color:var(--brand)}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
  .bar :focus-visible{outline-color:var(--brand-ink)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  .nowrap{white-space:nowrap}
  .bar{background:var(--brand);color:var(--brand-ink);padding:8px 16px;display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;border-radius:8px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px}
  .bar b{font-size:17px}.bar small{opacity:.8;font-size:12px;border:1px solid currentColor;border-radius:99px;padding:1px 8px}
  .bar a{color:inherit;text-decoration:none}.bar .home{display:flex;align-items:center;gap:10px;min-height:44px}
  main{max-width:440px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  h1{font-size:20px;margin:4px 0 12px}
  .amount{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 6px}
  .muted{color:var(--muted);font-size:14px}
  .row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .row span:first-child{color:var(--muted)}.row span:last-child{text-align:right}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:600 16px var(--font);background:var(--brand);color:var(--brand-ink);cursor:pointer;text-align:center;text-decoration:none;min-height:48px}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
  .note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}
  .pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .pin input{width:100%;max-width:200px;text-align:center;letter-spacing:12px;font-size:26px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
  .err{color:var(--err);text-align:center;font-size:14px}
  label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  label.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
  .ok{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:32px;margin:8px auto 12px}
  footer{max-width:440px;margin:0 auto;padding:4px 16px 24px;color:var(--muted);font-size:12px;text-align:center}
  .bar b,.bar .login{white-space:nowrap}
  @media (max-width:420px){.bar{gap:6px;padding:8px 10px}.bar b{font-size:16px}.bar small{display:none}.bar .login{font-size:12.5px;padding:4px 6px}}
  @media (max-width:370px){.bar .home b{display:none}}
  /* charts drawn by /static/kchart.js */
  .kc{display:block;width:100%;height:auto;overflow:visible;font-family:var(--font)}
  .kc text{font-size:11px;fill:var(--muted)}
  .kc .kc-label{font-size:12.5px;fill:var(--ink)}
  .kc .kc-val{font-size:11.5px;fill:var(--ink)}
  .kc .kc-strong{font-weight:700}
  .kc-grid{stroke:var(--line)}.kc-base{stroke:var(--muted);opacity:.45}
  .kc-bar{fill:var(--brand)}.kc-soft{opacity:.42}
  .kc-line{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .kc-area{fill:var(--brand);opacity:.1}
  .kc-dot{fill:var(--brand);stroke:var(--card);stroke-width:1.5}
  /* inside a banking app's WebView: no site chrome, no outer margins, clear of notches */
  body.embed{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .kc-empty{color:var(--muted);font-size:14px;margin:8px 0}
.bar .login{margin-left:auto;color:inherit;text-decoration:none;font-size:13px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.12);white-space:nowrap}
</style>
{% block head %}{% endblock %}
</head>
<body{% if embed or request.query_params.get('web') %} class="embed"{% endif %}>
{% if not embed and not request.query_params.get('web') %}<div class="bar"><a class="home" href="/s-mobiili/" aria-label="S-Pankki home"><div class="logo" aria-hidden="true">S</div><b>S-Pankki</b></a>{% set me = wa_login(request) %}{% if me %}<a class="login" href="/bank" title="Logged in with WhatsApp">{{ me }}</a>{% else %}<a class="login" href="/login">Log in</a>{% endif %}</div>{% endif %}
{% block body %}{% endblock %}
<script>
// Inside the chat's confirm sheet (an iframe), "back" links close the sheet instead of loading the chat in it.
if (window.parent !== window) document.querySelectorAll("[data-back]").forEach(a => a.addEventListener("click", e => {
  e.preventDefault(); window.parent.postMessage("close", "*");
}));
</script>
</body>
</html>
