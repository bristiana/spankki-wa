{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<main>
  <div class="card" style="text-align:center">
    <div class="ok">✓</div>
    <h1>{{ title }}</h1>
    {% for l in lines %}<p class="muted">{{ l }}</p>{% endfor %}
    {% if wa %}<a class="btn" href="https://wa.me/{{ wa }}">Back to WhatsApp</a>{% else %}<p class="muted">You can go back to the chat.</p>{% endif %}
  </div>
</main>
<script>if (window.parent !== window) window.parent.postMessage("done", "*");</script>
{% endblock %}
