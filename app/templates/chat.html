{% extends "base.html" %}
{% block title %}Money coach{% endblock %}
{% block head %}
<style>
  body{display:flex;flex-direction:column;height:100dvh}
  footer{display:none}
  #log{flex:1;overflow-y:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
  .msg{max-width:85%;padding:10px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
  .me{width:fit-content;margin-left:auto;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
  .bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;margin-left:40px;position:relative}
  .bot::before{content:"";position:absolute;left:-40px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:#fff6e8 url(/static/birky.svg) center/120% no-repeat;border:1px solid var(--line)}
  .bot .btn{margin-top:10px;padding:11px;min-height:44px;font-size:15px}
  .bot .btn:disabled{opacity:.45;cursor:default}.bot .btn.picked{opacity:1;background:var(--soft);border-color:var(--brand)}
  .typing{color:var(--muted);font-size:14px;padding:6px 2px 6px 0;display:flex;align-items:center;gap:8px}
  .typing i{display:inline-flex;gap:3px}.typing i b{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
  .typing i b:nth-child(2){animation-delay:.2s}.typing i b:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;max-width:560px;width:100%;margin:0 auto;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  /* "More ideas": every idea at once, wrapped and scrollable, instead of more chips hidden off to the right */
  .chips.all{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:40dvh;-webkit-mask-image:none;mask-image:none;padding-top:4px}
  .chips.all button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left}
  .chips:not(.all) .more{display:none}
  .chips button[data-more]{color:var(--brand);font-weight:600}
  .chips button{flex:none;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:14px system-ui;cursor:pointer;white-space:nowrap}
  form#f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
  form#f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:12px 16px;font:16px system-ui;background:var(--bg);color:var(--ink)}
  form#f button{border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font:600 15px system-ui;padding:0 18px;min-height:44px;cursor:pointer}
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  #sheet.open{display:flex}
  #sheet .panel{background:var(--bg);width:100%;max-width:480px;height:88dvh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column}
  #sheet .top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 16px;background:var(--card);border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
  #sheet .top button{border:0;background:transparent;color:var(--ink);font-size:24px;cursor:pointer;width:44px;height:44px;border-radius:50%}
  #sheet iframe{flex:1;border:0;width:100%}
  .msg.has-chart{width:85%}
  .chart{white-space:normal;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .chart b{display:block;font-size:14px}.chart small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  .chart .plot{width:100%}  .embed #sheet .panel{max-width:none;height:92%}
  /* "How I worked this out": the steps, figures and sources behind a reply, folded under its bubble */
  .how{max-width:85%;margin:-2px 0 8px 40px;font-size:13px}
  .how summary{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;cursor:pointer;list-style:none;color:var(--brand);font-weight:600}
  .how summary::-webkit-details-marker{display:none}
  .how summary::after{content:"›";display:inline-block;font-size:16px;transition:transform .15s}
  .how[open] summary::after{transform:rotate(90deg)}
  .how-body{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
  .how-steps{margin:0;padding-left:20px}.how-steps li{margin:0 0 10px}.how-steps li:last-child{margin-bottom:0}
  .how-steps li::marker{color:var(--muted)}.how-steps li:only-child{list-style:none;margin-left:-20px}.how-steps p{margin:0 0 6px;font-size:14px}
  .how dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;padding:8px 10px;background:var(--soft);border-radius:8px}
  .how dt{color:var(--muted)}.how dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .how-src{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;overflow-wrap:anywhere}
  .how-src b{color:var(--ink);font-weight:600}
  .how-check{margin:8px 0 0;color:var(--brand);font-weight:600}.how-check.warn{color:var(--warn)}
</style>
<script src="/static/kchart.js"></script>
<script src="/static/trace.js"></script>
{% endblock %}
{% block body %}
<div id="log" aria-live="polite" aria-label="Conversation with Birky">
  <div class="msg bot">Hi {{ name }} 👋 I'm <b>Birky</b>, your S-Pankki money coach. Ask me anything about your money.</div>
</div>
<div class="chips" id="chips">
  <button data-q="__start__">🐿️ Get started</button>
  <button data-q="__remind__">⏰ Rent reminder</button>
  <button>🧺 Play the basket game</button>
  <button>What is safe for me to spend this week?</button>
  <button>When do I spend most on restaurants?</button>
  <button class="more">Show my groceries by month</button>
  <button>How much did I spend on taxis last month?</button>
  <button>How much can I safely save?</button>
  <button>Could I afford my first home?</button>
  <button class="more" data-q="__alert__:renewal">🔁 Renewal alert</button>
  <button class="more" data-q="__alert__:salary">💰 Salary landed</button>
  <button class="more" data-q="__alert__:unusual">👀 Unusual spend</button>
  <button class="more">Show my money across all my banks</button>
  <button class="more">Can I afford a 120€ jacket?</button>
  <button class="more">What kind of spender am I?</button>
  <button class="more">What subscriptions am I paying for?</button>
  <button class="more">How much could I save if I cut dining out by 20%?</button>
  <button class="more">I want to save 1500 euros for a trip to Lapland by next summer</button>
  <button class="more">How much have I invested so far?</button>
  <button data-more aria-expanded="false" aria-controls="chips">More ideas ›</button>
</div>
<form id="f" autocomplete="off">
  <input id="q" placeholder="Ask about your money…" aria-label="Message" enterkeyhint="send">
  <button id="send">Send</button>
</form>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Confirm in S-Pankki">
  <div class="panel"><div class="top"><span>🔒 S-Pankki</span><button id="close" aria-label="Close and go back to the chat">×</button></div><iframe id="frame" title="Confirm"></iframe></div>
</div>
<script>
const log = document.getElementById("log"), q = document.getElementById("q");
const sheet = document.getElementById("sheet"), frame = document.getElementById("frame");
let sid = "s" + Math.random().toString(36).slice(2, 10);
try { sid = sessionStorage.getItem("sid") || sid; sessionStorage.setItem("sid", sid); } catch (e) {}

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Amounts never break across lines: "1 313.89 €" keeps its spaces non-breaking.
function nb(s) { return s.replace(/(\d) (?=\d{3}(?!\d))/g, "$1\u00a0").replace(/(\d) €/g, "$1\u00a0€"); }
function fmt(s) { return nb(esc(s)).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>"); }

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
// A long answer is read from its first line: scroll its top into view instead of jumping to its last line.
function reveal(d) {
  const top = d.offsetTop - log.offsetTop - 8;
  log.scrollTop = d.offsetHeight > log.clientHeight * 0.8 ? top : log.scrollHeight;
}

function openSheet(url) { frame.src = url; sheet.classList.add("open"); }
function closeSheet() { if (!sheet.classList.contains("open")) return; sheet.classList.remove("open"); frame.src = "about:blank"; checkInbox(); }
document.getElementById("close").onclick = closeSheet;
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });  // tap outside the panel
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;
  if (e.data === "done") setTimeout(closeSheet, 2200);  // long enough to read the receipt; the chat repeats it
  if (e.data === "close") closeSheet();
});
// The keyboard must not cover the input: follow the visual viewport where the browser does not resize the page.
if (window.visualViewport) {
  const fit = () => { document.body.style.height = visualViewport.height + "px"; log.scrollTop = log.scrollHeight; };
  visualViewport.addEventListener("resize", fit);
}

async function checkInbox() {
  try {
    const r = await fetch("/api/inbox?session=" + encodeURIComponent(sid));
    const j = await r.json();
    for (const m of j.messages || []) add("bot", fmt(m));
  } catch (e) {}
}
setInterval(checkInbox, 2500);

async function send(text, shown) {
  if (!text) return;
  if (shown !== null) add("me", esc(shown || text));
  const t = add("typing", '<span class="birky think" style="--s:32px" aria-hidden="true"></span>Birky is thinking <i aria-hidden="true"><b></b><b></b><b></b></i>'); t.className = "typing";
  t.setAttribute("role", "status");
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"content-type": "application/json"},
                                         body: JSON.stringify({session: sid, text, as: {{ persona.id|tojson }}})});
    const j = r.ok ? await r.json() : {text: "Sorry, that didn't work on my side. Try again, or pick one of the ideas below."};
    t.remove();
    const d = add("bot", fmt(j.text || "…"));
    for (const c of j.charts || []) {  // explore_my_data: the engine's numbers, drawn right in the bubble
      d.classList.add("has-chart");
      const box = document.createElement("div"), plot = document.createElement("div");
      box.className = "chart"; plot.className = "plot";
      box.innerHTML = "<b>" + esc(c.title) + "</b><small>" + esc(c.subtitle) + "</small>";
      box.appendChild(plot); d.appendChild(box);
      window.birkyChart(plot, c);
      const a = document.createElement("button");
      a.className = "btn ghost"; a.textContent = "Open in Explore";
      a.onclick = () => openSheet(c.url + (c.url.includes("?") ? "&" : "?") + "web=1");
      box.appendChild(a);
    }
    for (const b of j.buttons || []) {
      const a = document.createElement("button");
      a.className = "btn"; a.textContent = b.label;
      a.onclick = () => openSheet(b.url + (b.url.includes("?") ? "" : "?web=1"));
      d.appendChild(a);
    }
    for (const b of j.quick || []) {
      const btn = document.createElement("button");
      btn.textContent = b.label; btn.className = "btn ghost";
      btn.onclick = () => {  // one answer per question: the choice stays marked, the others are done
        d.querySelectorAll("button.ghost[data-quick]").forEach(x => x.disabled = true);
        btn.classList.add("picked");
        send(b.send, b.label);
      };
      btn.dataset.quick = "1";
      d.appendChild(btn);
    }
    const how = window.birkyTrace(j.trace);  // collapsed under the bubble: what Birky looked up and checked
    if (how) d.insertAdjacentHTML("afterend", how);
    reveal(d);
  } catch (e) { t.remove(); add("bot", "Connection problem, try again."); }
}

document.getElementById("f").onsubmit = e => { e.preventDefault(); const v = q.value.trim(); q.value = ""; send(v); };
const chips = document.getElementById("chips");
chips.querySelectorAll("button").forEach(b => b.onclick = () => {
  if (b.hasAttribute("data-more")) {  // 8 ideas at first; the rest one tap away
    const all = chips.classList.toggle("all");
    b.textContent = all ? "Fewer ‹" : "More ideas ›"; b.setAttribute("aria-expanded", all);
    return;
  }
  if (chips.classList.contains("all")) chips.querySelector("[data-more]").click();  // fold the ideas away again
  b.dataset.q ? send(b.dataset.q, null) : send(b.textContent);
});

// Deep link /chat?q=...: ask once, then drop q from the address so a reload doesn't ask again.
const deepQ = {{ q|tojson }};
if (deepQ) {
  history.replaceState(null, "", location.pathname + ({{ embed|tojson }} ? "?embed=1" : ""));
  deepQ.startsWith("__") ? send(deepQ, null) : send(deepQ);
}
</script>
{% endblock %}
